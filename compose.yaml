services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      # install.sh sets ATLAS_BIND to 127.0.0.1 when HTTPS is on, so the only
      # way in from the network is through Caddy.
      - "${ATLAS_BIND:-0.0.0.0}:${ATLAS_PORT:-8000}:8000"

  # The nightly copy for Reports (2:00 AM, ATLAS_SYNC_HOUR and ATLAS_TIME_ZONE
  # in .env change it), plus any "Sync now". Logs: docker compose logs sync
  sync:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "manage.py", "run_sync_schedule"]

  # HTTPS in front of Atlas. Only runs when COMPOSE_PROFILES=https, which
  # install.sh sets when ATLAS_HTTPS_HOST is filled in. Logs: docker compose logs caddy
  caddy:
    build: ./caddy
    profiles: ["https"]
    restart: unless-stopped
    environment:
      ATLAS_HTTPS_HOST: ${ATLAS_HTTPS_HOST:-}
      ATLAS_HTTPS_PORT: ${ATLAS_HTTPS_PORT:-443}
      ATLAS_HTTPS_CERT: ${ATLAS_HTTPS_CERT:-letsencrypt}
      ATLAS_ALLOWED_IPS: ${ATLAS_ALLOWED_IPS:-0.0.0.0/0 ::/0}
      ATLAS_DNS_API_TOKEN: ${ATLAS_DNS_API_TOKEN:-}
    depends_on:
      - web
    ports:
      - "80:80"
      - "${ATLAS_HTTPS_PORT:-443}:${ATLAS_HTTPS_PORT:-443}"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
